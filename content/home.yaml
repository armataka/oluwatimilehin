intro:
  - |-
    I design operational software: the tools people use
    to run tax audits, move gas and keep contracts on track.
    Work where a wrong number has consequences.
  - |-
    For five years, usually as the only designer on the team,
    I’ve learned the domain first, worked out the data model
    with engineers, and only then designed the screens.
openTo: Open to senior product design roles, remote or in Lagos.
