intro:
  - >-
    Leaving my mark on the world, one pixel, one idea, one step at a time. I’ve drawn
    an obscene amount of rectangles in my career thus far. Why? These rectangles are
    special, you see; they come to life when I work my magic on them.
  - >-
    6+ years of learning, growing, and stacking rectangles to build intelligent systems
